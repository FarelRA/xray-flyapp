# fly.toml file generated for your-app-name on 2023-10-27T14:48:47+07:00

app = 'farel' # Change this to your app name
primary_region = 'sin'
kill_signal = 'SIGTERM'
kill_timeout = '2m'

[build]
  dockerfile = 'Dockerfile'

[env]
  # --- Critical Secrets (Set with `fly secrets set`) ---
  # DASHBOARD_USER = "admin"
  # DASHBOARD_PWD = "your_strong_password"
  # FRP_TOKEN = "your_frp_token"
  # UUID = "your_xray_uuid"

  # --- General Configuration ---
  # Your SSH public key for admin access
  sshPubKey = 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHZ2+s38OZO9N/nxhyz4K8K4bk29h8gSSZ5LQk3FKVdy farel@CachyOS'

[mounts]
  source = 'app_data'
  destination = '/data'

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512 # Increased memory for all services

############################################################
# INCOMING SERVICES
# All traffic is routed by fly.io's proxy to internal ports.
############################################################

# --- Traefik HTTP/S Entrypoint (for Xray, Dashboards) ---
[[services]]
  protocol = 'tcp'
  internal_port = 80
  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

[[services]]
  protocol = 'tcp'
  internal_port = 443
  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']
  [services.ports.tls_options]
    alpn = ['h2', 'http/1.1']

# --- SSH Admin Access ---
[[services]]
  protocol = 'tcp'
  internal_port = 22
  [[services.ports]]
    port = 22

# --- FRPS Main Control Plane ---
[[services]]
  protocol = 'tcp'
  internal_port = 7000
  [[services.ports]]
    port = 7000

# --- FRPS KCP (UDP) ---
[[services]]
  protocol = 'udp'
  internal_port = 7001
  [[services.ports]]
    port = 7001

# --- FRPS QUIC (UDP) ---
[[services]]
  protocol = 'udp'
  internal_port = 7002
  [[services.ports]]
    port = 7002

############################################################
# FRPS PROXY PORTS
# Ports opened for frpc clients to use for their tunnels.
# Add or remove as needed.
############################################################

[[services]]
  protocol = 'tcp'
  internal_port = 2222 # SSH
  [[services.ports]]
    port = 2222

[[services]]
  protocol = 'tcp'
  internal_port = 5900 # VNC
  [[services.ports]]
    port = 5900

[[services]]
  protocol = 'udp'
  internal_port = 5900 # VNC
  [[services.ports]]
    port = 5900

[[services]]
  protocol = 'tcp'
  internal_port = 25565 # Minecraft Java
  [[services.ports]]
    port = 25565

[[services]]
  protocol = 'udp'
  internal_port = 19132 # Minecraft Bedrock
  [[services.ports]]
    port = 19132
